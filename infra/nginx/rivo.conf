# RIVO reverse proxy — Master Plan §15.
#
# TLS is terminated by Cloudflare in front of this, and again here by certbot or
# Caddy for origin encryption. Both hops matter: Cloudflare "Flexible" SSL would
# leave the origin leg in plaintext.

upstream rivo_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream rivo_admin {
    server 127.0.0.1:3002;
    keepalive 16;
}

# Budgets are per-origin-IP. Cloudflare rate limiting sits in front of these;
# this layer is what protects the origin if someone finds it directly.
limit_req_zone $binary_remote_addr zone=rivo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rivo_auth:10m rate=2r/s;

server {
    listen 80;
    server_name api.RIVO_DOMAIN admin.RIVO_DOMAIN;
    # Everything except the ACME challenge is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.RIVO_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/api.RIVO_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.RIVO_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Property photos go straight to R2 and reels straight to Cloudflare Stream,
    # so nothing large should ever pass through here. A small cap makes an
    # accidental large POST fail fast instead of tying up a worker.
    client_max_body_size 4m;
    client_body_timeout 30s;

    access_log /var/log/nginx/rivo-api.access.log;
    error_log  /var/log/nginx/rivo-api.error.log warn;

    location /api/v1/auth/ {
        limit_req zone=rivo_auth burst=5 nodelay;
        proxy_pass http://rivo_api;
        include /etc/nginx/rivo-proxy-params.conf;
    }

    # Gateway callbacks must not be rate limited: dropping one loses a payment
    # confirmation. Restrict by source IP here once the provider publishes its
    # egress range.
    location /api/v1/payments/webhook/ {
        proxy_pass http://rivo_api;
        include /etc/nginx/rivo-proxy-params.conf;
    }

    location /api/v1/health {
        access_log off;
        proxy_pass http://rivo_api;
        include /etc/nginx/rivo-proxy-params.conf;
    }

    location / {
        limit_req zone=rivo_api burst=40 nodelay;
        proxy_pass http://rivo_api;
        include /etc/nginx/rivo-proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.RIVO_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/admin.RIVO_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.RIVO_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://rivo_admin;
        include /etc/nginx/rivo-proxy-params.conf;
    }
}
