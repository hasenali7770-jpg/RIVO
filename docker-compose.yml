# RIVO — one-command local stack (Master Plan §22 item 16).
#
#   cp .env.example .env    # fill in what you have; the stack runs without the
#                           # optional integrations and says which are missing
#   docker compose up -d --build
#   docker compose exec api npx prisma migrate deploy
#   docker compose exec api npm run seed
#
# API      → http://localhost:3000/api/v1
# Swagger  → http://localhost:3000/api/docs
# Admin    → http://localhost:3002

name: rivo

services:
  postgres:
    # postgis/postgis rather than plain postgres: RIVO cannot run without the
    # extension, so it belongs in the image rather than in a setup step someone
    # can forget.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rivo_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rivo}
      # Slightly faster and safer collation behaviour for a fresh cluster.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost so a laptop on a shared network does not expose the
      # database.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rivo} -d ${POSTGRES_DB:-rivo}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Applies migrations once, then exits. The runtime image is installed with
  # --omit=dev and has no Prisma CLI, so this uses the build stage, which does.
  # api and worker wait for it to complete successfully: starting them against a
  # database with no tables produced a stack that came up and then failed every
  # request.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rivo}:${POSTGRES_PASSWORD:-rivo_local_dev}@postgres:5432/${POSTGRES_DB:-rivo}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    working_dir: /app
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'apps/api/prisma/schema.prisma']
    restart: 'no'

  # Feature flags and the bootstrap Super Admin. Set RIVO_SEED_DEMO_PUBLISHED=true
  # in .env to also create the sample marketplace used for demonstrations; it is
  # refused outright when APP_ENV=production.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rivo}:${POSTGRES_PASSWORD:-rivo_local_dev}@postgres:5432/${POSTGRES_DB:-rivo}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
    working_dir: /app
    command: ['npm', 'run', 'seed', '-w', '@rivo/api']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Overrides the .env host values with the compose service names.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rivo}:${POSTGRES_PASSWORD:-rivo_local_dev}@postgres:5432/${POSTGRES_DB:-rivo}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rivo}:${POSTGRES_PASSWORD:-rivo_local_dev}@postgres:5432/${POSTGRES_DB:-rivo}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Same image, different entrypoint: media and AI work must not compete with
    # request handling for the API's event loop.
    command: ['node', 'dist/worker.js']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "node dist/worker.js" > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Browser-visible, so it must be the address the operator's browser can
      # reach — not the compose service name.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      PORT: '3002'
    depends_on:
      api: { condition: service_started }
    ports:
      - '3002:3002'

volumes:
  postgres-data:
  redis-data:
